databases:
  - name: comandadigital-db
    databaseName: comandadigital
    user: comandadigital
    plan: free

services:
  - type: web
    name: comandadigital-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comandadigital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
